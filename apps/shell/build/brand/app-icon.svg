<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cheil Planning Office app icon (source of truth). Cheil fork: replaces the
  upstream mark.

  A planning sheet on a navy tile: a page with a folded corner and three
  outline bars, the middle one in the accent colour (the line that carries
  the message). Drawn from plain shapes; no company logo is used or imitated.

  Every raster/container icon in the repo is derived from this file:
    node tools/gen-brand-assets.mjs
  Keep the 1024x1024 canvas and the full-bleed rounded tile; the generator
  insets the whole drawing for the macOS variants.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="230" fill="#0B3D91"/>
  <path d="M348 196 H604 L732 324 V772 A56 56 0 0 1 676 828 H348 A56 56 0 0 1 292 772 V252 A56 56 0 0 1 348 196 Z" fill="#FFFFFF"/>
  <path d="M604 196 V292 A32 32 0 0 0 636 324 H732 Z" fill="#B9C8E8"/>
  <rect x="372" y="420" width="280" height="60" rx="30" fill="#0B3D91"/>
  <rect x="372" y="530" width="280" height="60" rx="30" fill="#FF5A36"/>
  <rect x="372" y="640" width="184" height="60" rx="30" fill="#0B3D91"/>
</svg>
