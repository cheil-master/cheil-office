<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cheil Planning Office logo lockup (source of truth for the in-app sidebar
  logo). Cheil fork: replaces the upstream lockup.

  Pure black and white on purpose: the shell flips it for dark themes with a
  CSS invert filter, so it must not carry any colour.

  The mark repeats apps/shell/build/brand/app-icon.svg in a single colour: the
  page, with its fold and outline bars cut out. The wordmark is live text in
  the Windows system font (Malgun Gothic), fitted to its box with textLength.

  Copied verbatim to apps/shell/src/renderer/src/assets/genoffice-logo.svg by
    node tools/gen-brand-assets.mjs
  Keep the 1091x240 canvas: the sidebar sizes the logo by height.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1091" height="240" viewBox="0 0 1091 240" fill="none">
  <svg width="240" height="240" viewBox="0 0 1024 1024">
    <defs>
      <mask id="cheil-page" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
        <rect width="1024" height="1024" fill="#fff"/>
        <path d="M604 150 V292 A32 32 0 0 0 636 324 H778 Z" fill="#000"/>
        <rect x="372" y="420" width="280" height="60" rx="30" fill="#000"/>
        <rect x="372" y="530" width="280" height="60" rx="30" fill="#000"/>
        <rect x="372" y="640" width="184" height="60" rx="30" fill="#000"/>
      </mask>
    </defs>
    <path d="M348 150 H604 L778 324 V818 A56 56 0 0 1 722 874 H302 A56 56 0 0 1 246 818 V206 A56 56 0 0 1 302 150 Z" fill="#000" mask="url(#cheil-page)"/>
  </svg>
  <text x="272" y="164" fill="#000" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-weight="700" font-size="112" textLength="800" lengthAdjust="spacingAndGlyphs">Cheil 기획 오피스</text>
</svg>
